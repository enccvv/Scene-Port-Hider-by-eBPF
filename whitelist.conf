# Whitelist firewall configuration for NetWhitelist (eBPF cgroup-based).
#
# Format notes:
#   DEFAULT_ALLOW   : 0 = deny unmatched outbound, 1 = allow unmatched outbound.
#   UID_MODE        : 0 = filter all UIDs, 1 = filter only the UIDs in ONLY_UIDS.
#   ALLOW_LOOPBACK  : 1 = always allow 127.0.0.0/8 and ::1.
#   BYPASS_UIDS     : comma-separated UIDs that always bypass the firewall.
#   ONLY_UIDS       : comma-separated UIDs subject to filtering when UID_MODE=1.
#   RULE4           : proto|dst_ip|port_start|port_end   (dst_ip "*" = any)
#   RULE6           : proto|dst_prefix|port_start|port_end
#   proto is tcp, udp or * (both).
#
# The ICMP4/ICMP6 (ping) rules below are consumed by whitelist_start.sh and
# applied with iptables/nft on the device; they are not loaded into the eBPF
# maps (the cgroup connect hook cannot see ICMP).

DEFAULT_ALLOW=0
UID_MODE=0
ALLOW_LOOPBACK=1
BYPASS_UIDS=
ONLY_UIDS=

# DNS over UDP/TCP on any destination.
RULE4=udp|*|53|53
RULE4=tcp|*|53|53

# Application control ports on any destination.
RULE4=tcp|*|8081|8081
RULE4=udp|*|8081|8081
RULE4=tcp|*|16001|16001
RULE4=udp|*|16001|16001
RULE4=tcp|*|17000|17001
RULE4=udp|*|17000|17001

# Dedicated UDP/TCP endpoint.
RULE4=tcp|112.80.130.26|31006|31006
RULE4=udp|112.80.130.26|31006|31006

# HTTPS (443/TCP) to the five pinned VPN gateway IPs.
RULE4=tcp|110.242.70.69|443|443
RULE4=tcp|110.242.70.68|443|443
RULE4=tcp|153.3.237.117|443|443
RULE4=tcp|180.101.52.165|443|443
RULE4=tcp|157.0.146.158|443|443

# IPv6 DNS to global unicast destinations (2000::/3).
RULE6=tcp|2000::/3|53|53
RULE6=udp|2000::/3|53|53

# Ping targets (handled by the shell on the device, not by eBPF).
ICMP_ALLOW_ALL=0
ICMP4=106.55.91.128
# ICMP6 rule example (link-local scope cannot be routed):
# ICMP6=2001:4860:4860::8888

# Source networks for diagnostics (not enforced by eBPF).
SRC_NET4=
SRC_NET6=
